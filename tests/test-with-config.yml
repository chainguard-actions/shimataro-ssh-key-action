name: Test SSH key installation with SSH config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate test SSH key
        id: gen-key
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          PRIVATE_KEY=$(cat /tmp/test_key)
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          echo "$PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - id: action
        uses: .
        with:
          key: ${{ steps.gen-key.outputs.private_key }}
          known_hosts: "github.com ssh-rsa "
          name: id_rsa
          config: |
            Host github.com
              User git
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking yes
      - name: Assert SSH config file exists
        run: |
          echo "Checking if SSH config was created..."
          if [ ! -f "$HOME/.ssh/config" ]; then
            echo "FAIL: SSH config file not found at ~/.ssh/config"
            exit 1
          fi
          echo "PASS: SSH config file exists"
          echo "--- Config contents ---"
          cat "$HOME/.ssh/config"
      - name: Assert SSH config contains expected host entry
        run: |
          if ! grep -q "Host github.com" "$HOME/.ssh/config"; then
            echo "FAIL: SSH config does not contain 'Host github.com'"
            exit 1
          fi
          echo "PASS: SSH config contains expected host entry"
      - name: Assert SSH config file permissions
        run: |
          PERMS=$(stat -c "%a" "$HOME/.ssh/config")
          echo "~/.ssh/config permissions: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected config file permissions to be 600, got $PERMS"
            exit 1
          fi
          echo "PASS: config file has correct permissions (600)"
