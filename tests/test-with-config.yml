name: Test SSH key installation with SSH config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-key
        uses: .
        with:
          key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAAbG9nZ2luLXBhc3N3b3JkAAAAFgAAAAEAAAAzAAAAC3NzaC1l
            ZDI1NTE5AAAAIOMqLasseqaQ4n0Vx3jwyYfKAyJa/zIa3sBQjBISyndzAAAAsHRlc3Rr
            ZXkAAAAAAAAAAAAAAAAzAAAAC3NzaC1lZDI1NTE5AAAAIOMqLasseqaQ4n0Vx3jwyYfK
            AyJa/zIa3sBQjBISyndzAAAAQHRlc3RrZXkAAAAAAAAAAAAAAAAzAAAAC3NzaC1lZDI1
            NTE5AAAAIOMqLasseqaQ4n0Vx3jwyYfKAyJa/zIa3sBQjBISyndzAAAAQHRlc3Rr
            ZXkAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            -----END OPENSSH PRIVATE KEY-----
          known_hosts: |
            github.com ssh-rsa 
          config: |
            Host github.com
              IdentityFile ~/.ssh/id_rsa
              User git
              StrictHostKeyChecking yes
      - name: Assert key file exists
        run: |
          echo "Checking ~/.ssh/id_rsa exists..."
          if [ ! -f "$HOME/.ssh/id_rsa" ]; then
            echo "FAIL: ~/.ssh/id_rsa not found"
            exit 1
          fi
          echo "PASS: key file exists"
      - name: Assert SSH config file exists
        run: |
          echo "Checking ~/.ssh/config exists..."
          if [ ! -f "$HOME/.ssh/config" ]; then
            echo "FAIL: ~/.ssh/config not found"
            exit 1
          fi
          echo "PASS: SSH config file exists"
      - name: Assert SSH config contains expected content
        run: |
          CONFIG=$(cat "$HOME/.ssh/config")
          echo "SSH config content:"
          echo "$CONFIG"
          if ! echo "$CONFIG" | grep -q "github.com"; then
            echo "FAIL: SSH config does not contain 'github.com'"
            exit 1
          fi
          echo "PASS: SSH config contains expected content"
      - name: Assert SSH config file permissions
        run: |
          PERMS=$(stat -c "%a" "$HOME/.ssh/config")
          echo "SSH config permissions: $PERMS"
          if [ "$PERMS" != "644" ]; then
            echo "FAIL: expected permissions 644, got $PERMS"
            exit 1
          fi
          echo "PASS: SSH config has correct permissions"
