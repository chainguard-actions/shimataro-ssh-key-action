name: Test SSH key installation with SSH config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a test SSH key pair
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -C "test@example.com"
          echo "TEST_SSH_KEY<<SSHEOF" >> "$GITHUB_ENV"
          cat /tmp/test_key >> "$GITHUB_ENV"
          echo "SSHEOF" >> "$GITHUB_ENV"

      - id: action
        name: Install SSH key with config
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY }}
          known_hosts: unnecessary
          config: |
            Host example.com
              IdentityFile ~/.ssh/id_rsa
              User git

      - name: Assert SSH config file was created
        run: |
          SSH_DIR="/root/.ssh"
          echo "SSH_DIR=$SSH_DIR"
          ls -la "$SSH_DIR" || true
          if [ ! -f "$SSH_DIR/config" ]; then
            echo "FAIL: $SSH_DIR/config does not exist"
            exit 1
          fi
          echo "PASS: $SSH_DIR/config exists"

      - name: Assert SSH config contains expected content
        run: |
          SSH_DIR="/root/.ssh"
          cat "$SSH_DIR/config"
          if ! grep -q "Host example.com" "$SSH_DIR/config"; then
            echo "FAIL: $SSH_DIR/config does not contain 'Host example.com'"
            exit 1
          fi
          if ! grep -q "IdentityFile" "$SSH_DIR/config"; then
            echo "FAIL: $SSH_DIR/config does not contain IdentityFile entry"
            exit 1
          fi
          echo "PASS: $SSH_DIR/config contains expected content"

      - name: Assert SSH key file was also created
        run: |
          SSH_DIR="/root/.ssh"
          if [ ! -f "$SSH_DIR/id_rsa" ]; then
            echo "FAIL: $SSH_DIR/id_rsa does not exist"
            exit 1
          fi
          echo "PASS: $SSH_DIR/id_rsa exists"
