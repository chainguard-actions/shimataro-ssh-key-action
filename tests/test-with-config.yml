name: Test SSH key installation with SSH config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test SSH key
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -C "test@example.com"
          echo "TEST_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY }}
          known_hosts: "github.com ssh-rsa "
          config: |
            Host github.com
              User git
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking yes
          if_key_exists: fail

      - name: Assert SSH config file exists
        run: |
          echo "Checking ~/.ssh/config exists..."
          if [ ! -f "$HOME/.ssh/config" ]; then
            echo "FAIL: ~/.ssh/config not found"
            exit 1
          fi
          echo "PASS: ~/.ssh/config exists"

      - name: Assert SSH config contains expected host entry
        run: |
          echo "Contents of ~/.ssh/config:"
          cat "$HOME/.ssh/config"
          if ! grep -q "Host github.com" "$HOME/.ssh/config"; then
            echo "FAIL: ~/.ssh/config does not contain 'Host github.com'"
            exit 1
          fi
          echo "PASS: ~/.ssh/config contains expected host entry"

      - name: Assert SSH key file also exists
        run: |
          if [ ! -f "$HOME/.ssh/id_rsa" ]; then
            echo "FAIL: ~/.ssh/id_rsa not found"
            exit 1
          fi
          echo "PASS: ~/.ssh/id_rsa exists"
