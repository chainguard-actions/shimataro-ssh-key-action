name: Test SSH key installation with SSH config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a test SSH key pair
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -C "test@example.com"
          echo "TEST_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: install-key
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY }}
          known_hosts: "github.com ssh-rsa "
          config: |
            Host example.com
              User git
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no

      - name: Assert SSH config file exists
        run: |
          if [ ! -f "$HOME/.ssh/config" ]; then
            echo "FAIL: ~/.ssh/config not found"
            exit 1
          fi
          echo "PASS: ~/.ssh/config exists"
          cat "$HOME/.ssh/config"

      - name: Assert SSH config contains expected content
        run: |
          if ! grep -q "Host example.com" "$HOME/.ssh/config"; then
            echo "FAIL: ~/.ssh/config does not contain expected 'Host example.com'"
            exit 1
          fi
          echo "PASS: ~/.ssh/config contains expected content"

      - name: Assert SSH config has correct permissions
        run: |
          PERMS=$(stat -c "%a" "$HOME/.ssh/config")
          echo "permissions: $PERMS"
          # The action creates the config file with mode 0o644
          if [ "$PERMS" != "644" ]; then
            echo "FAIL: expected permissions 644, got $PERMS"
            exit 1
          fi
          echo "PASS: config permissions are 644"
