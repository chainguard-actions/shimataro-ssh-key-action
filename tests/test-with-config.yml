name: Test SSH key installation with SSH config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -C "test@example.com"
          echo "TEST_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Install SSH key with config
        id: action
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY }}
          known_hosts: "github.com ssh-rsa "
          config: |
            Host github.com
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking yes
          if_key_exists: fail

      - name: Assert SSH key file exists
        run: |
          KEY_FILE="$HOME/.ssh/id_rsa"
          echo "Checking for SSH key at: $KEY_FILE"
          if [ ! -f "$KEY_FILE" ]; then
            echo "FAIL: SSH key file not found at $KEY_FILE"
            exit 1
          fi
          echo "PASS: SSH key file exists"

      - name: Assert SSH config file exists and contains expected content
        run: |
          CONFIG_FILE="$HOME/.ssh/config"
          echo "Checking for SSH config at: $CONFIG_FILE"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "FAIL: SSH config file not found at $CONFIG_FILE"
            exit 1
          fi
          echo "Config file contents:"
          cat "$CONFIG_FILE"
          if ! grep -q "github.com" "$CONFIG_FILE"; then
            echo "FAIL: 'github.com' not found in SSH config"
            exit 1
          fi
          if ! grep -q "IdentityFile" "$CONFIG_FILE"; then
            echo "FAIL: 'IdentityFile' not found in SSH config"
            exit 1
          fi
          echo "PASS: SSH config file exists and contains expected entries"

      - name: Assert SSH config file permissions
        run: |
          CONFIG_FILE="$HOME/.ssh/config"
          PERMS=$(stat -c "%a" "$CONFIG_FILE")
          echo "Permissions: $PERMS"
          # The action creates the config file with mode 0o644
          if [ "$PERMS" != "644" ]; then
            echo "FAIL: expected permissions 644, got $PERMS"
            exit 1
          fi
          echo "PASS: SSH config file has correct permissions (644)"
