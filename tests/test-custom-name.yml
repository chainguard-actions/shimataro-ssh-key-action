name: Test SSH key installation with custom name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACBY2fNtMBMHMQpbFBQHMQpbFBQHMQpbFBQHMQpbFBQHMQAAAABY2fNt
            MBMHMQpbFBQHMQpbFBQHMQpbFBQHMQpbFBQHMQAAAAtzc2gtZWQyNTUxOQAAACBY2f
            NtMBMHMQpbFBQHMQpbFBQHMQpbFBQHMQpbFBQHMQAAAABY2fNtMBMHMQpbFBQHMQpb
            FBQHMQpbFBQHMQpbFBQHMQAAAEBY2fNtMBMHMQpbFBQHMQpbFBQHMQpbFBQHMQpbFB
            QHMQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB
            -----END OPENSSH PRIVATE KEY-----
          name: id_deploy
          known_hosts: "github.com ssh-rsa "

      - name: Assert custom-named key file exists
        run: |
          echo "Checking ~/.ssh/id_deploy exists..."
          if [ ! -f "$HOME/.ssh/id_deploy" ]; then
            echo "FAIL: ~/.ssh/id_deploy not found"
            exit 1
          fi
          echo "PASS: custom-named key file exists"

      - name: Assert default key file does not exist
        run: |
          if [ -f "$HOME/.ssh/id_rsa" ]; then
            echo "FAIL: ~/.ssh/id_rsa should not exist when custom name is used"
            exit 1
          fi
          echo "PASS: default key file correctly absent"
