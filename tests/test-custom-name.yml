name: Test SSH key installation with custom name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test SSH key pair
        id: keygen
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          PRIVATE_KEY=$(cat /tmp/test_key)
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          echo "$PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        with:
          key: ${{ steps.keygen.outputs.private_key }}
          known_hosts: "github.com ssh-rsa "
          name: id_deploy_key

      - name: Assert custom-named SSH key file exists
        run: |
          echo "Checking ~/.ssh/id_deploy_key exists..."
          if [ ! -f "$HOME/.ssh/id_deploy_key" ]; then
            echo "FAIL: ~/.ssh/id_deploy_key not found"
            exit 1
          fi
          echo "PASS: Custom-named SSH key file exists"

      - name: Assert default key name does NOT exist
        run: |
          if [ -f "$HOME/.ssh/id_rsa" ]; then
            echo "FAIL: ~/.ssh/id_rsa should not exist when custom name is used"
            exit 1
          fi
          echo "PASS: Default key name id_rsa does not exist (as expected)"

      - name: Assert custom key file has correct permissions
        run: |
          PERMS=$(stat -c "%a" "$HOME/.ssh/id_deploy_key")
          echo "actual permissions: $PERMS"
          if [ "$PERMS" != "600" ]; then
            echo "FAIL: expected permissions 600, got $PERMS"
            exit 1
          fi
          echo "PASS: Custom SSH key file has correct permissions"
