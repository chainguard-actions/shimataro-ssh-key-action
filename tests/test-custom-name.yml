name: Test SSH key installation with custom name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-key
        uses: .
        with:
          key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAAbG9nZ2luLXBhc3N3b3JkAAAAFgAAAAEAAAAzAAAAC3NzaC1l
            ZDI1NTE5AAAAIOMqLasseqaQ4n0Vx3jwyYfKAyJa/zIa3sBQjBISyndzAAAAsHRlc3Rr
            ZXkAAAAAAAAAAAAAAAAzAAAAC3NzaC1lZDI1NTE5AAAAIOMqLasseqaQ4n0Vx3jwyYfK
            AyJa/zIa3sBQjBISyndzAAAAQHRlc3RrZXkAAAAAAAAAAAAAAAAzAAAAC3NzaC1lZDI1
            NTE5AAAAIOMqLasseqaQ4n0Vx3jwyYfKAyJa/zIa3sBQjBISyndzAAAAQHRlc3Rr
            ZXkAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            -----END OPENSSH PRIVATE KEY-----
          name: id_deploy
          known_hosts: |
            github.com ssh-rsa 
      - name: Assert custom-named key file exists
        run: |
          echo "Checking ~/.ssh/id_deploy exists..."
          if [ ! -f "$HOME/.ssh/id_deploy" ]; then
            echo "FAIL: ~/.ssh/id_deploy not found"
            exit 1
          fi
          echo "PASS: custom-named key file exists"
      - name: Assert default key file does NOT exist
        run: |
          echo "Checking ~/.ssh/id_rsa does NOT exist..."
          if [ -f "$HOME/.ssh/id_rsa" ]; then
            echo "FAIL: ~/.ssh/id_rsa should not exist when custom name is used"
            exit 1
          fi
          echo "PASS: default key file correctly absent"
      - name: Assert custom key file permissions
        run: |
          PERMS=$(stat -c "%a" "$HOME/.ssh/id_deploy")
          echo "Key file permissions: $PERMS"
          if [ "$PERMS" != "400" ]; then
            echo "FAIL: expected permissions 400, got $PERMS"
            exit 1
          fi
          echo "PASS: key file has correct permissions"
