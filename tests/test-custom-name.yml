name: Test SSH key installation with custom name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a test SSH key pair
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -C "test@example.com"
          echo "TEST_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: install-key
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY }}
          name: id_custom
          known_hosts: "github.com ssh-rsa "

      - name: Assert custom-named SSH key file exists
        run: |
          if [ ! -f "$HOME/.ssh/id_custom" ]; then
            echo "FAIL: ~/.ssh/id_custom not found"
            exit 1
          fi
          echo "PASS: ~/.ssh/id_custom exists"

      - name: Assert default key file does NOT exist
        run: |
          if [ -f "$HOME/.ssh/id_rsa" ]; then
            echo "FAIL: ~/.ssh/id_rsa should not exist when custom name is used"
            exit 1
          fi
          echo "PASS: ~/.ssh/id_rsa does not exist (correct)"

      - name: Assert custom key file has correct permissions
        run: |
          PERMS=$(stat -c "%a" "$HOME/.ssh/id_custom")
          echo "permissions: $PERMS"
          # The action creates the key file with mode 0o400 (read-only for owner)
          if [ "$PERMS" != "400" ]; then
            echo "FAIL: expected permissions 400, got $PERMS"
            exit 1
          fi
          echo "PASS: permissions are 400"
