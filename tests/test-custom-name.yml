name: Test SSH key installation with custom name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test SSH key
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          echo "TEST_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY }}
          name: id_deploy
          known_hosts: "github.com ssh-rsa "

      - name: Assert custom-named SSH key file exists
        run: |
          if [ ! -f "$HOME/.ssh/id_deploy" ]; then
            echo "FAIL: SSH key file ~/.ssh/id_deploy does not exist"
            exit 1
          fi
          echo "PASS: SSH key file exists at ~/.ssh/id_deploy"

      - name: Assert default key name does not exist
        run: |
          if [ -f "$HOME/.ssh/id_rsa" ]; then
            echo "FAIL: default SSH key file ~/.ssh/id_rsa should not exist"
            exit 1
          fi
          echo "PASS: default key name id_rsa was not created"
