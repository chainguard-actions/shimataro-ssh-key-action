name: Test SSH key installation with custom name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -C "test@example.com"
          echo "TEST_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Install SSH key with custom name
        id: action
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY }}
          name: id_deploy
          known_hosts: "github.com ssh-rsa "
          if_key_exists: fail

      - name: Assert custom-named SSH key file exists
        run: |
          KEY_FILE="$HOME/.ssh/id_deploy"
          echo "Checking for SSH key at: $KEY_FILE"
          if [ ! -f "$KEY_FILE" ]; then
            echo "FAIL: SSH key file not found at $KEY_FILE"
            exit 1
          fi
          echo "PASS: Custom-named SSH key file exists"

      - name: Assert default key name does NOT exist
        run: |
          DEFAULT_KEY="$HOME/.ssh/id_rsa"
          echo "Checking that default key does NOT exist at: $DEFAULT_KEY"
          if [ -f "$DEFAULT_KEY" ]; then
            echo "FAIL: default key file id_rsa should not exist when custom name is used"
            exit 1
          fi
          echo "PASS: Default key file id_rsa does not exist (correct)"

      - name: Assert custom key file permissions
        run: |
          KEY_FILE="$HOME/.ssh/id_deploy"
          PERMS=$(stat -c "%a" "$KEY_FILE")
          echo "Permissions: $PERMS"
          # The action creates the key file with mode 0o400 (read-only for owner)
          if [ "$PERMS" != "400" ]; then
            echo "FAIL: expected permissions 400, got $PERMS"
            exit 1
          fi
          echo "PASS: SSH key file has correct permissions (400)"
