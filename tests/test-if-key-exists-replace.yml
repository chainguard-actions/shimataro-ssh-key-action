name: Test SSH key installation with if_key_exists=replace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-create SSH key to simulate existing key
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "old-key-content" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          echo "Pre-existing key created with old content"
      - id: install-key
        uses: .
        with:
          key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAAbG9nZ2luLXBhc3N3b3JkAAAAFgAAAAEAAAAzAAAAC3NzaC1l
            ZDI1NTE5AAAAIOMqLasseqaQ4n0Vx3jwyYfKAyJa/zIa3sBQjBISyndzAAAAsHRlc3Rr
            ZXkAAAAAAAAAAAAAAAAzAAAAC3NzaC1lZDI1NTE5AAAAIOMqLasseqaQ4n0Vx3jwyYfK
            AyJa/zIa3sBQjBISyndzAAAAQHRlc3RrZXkAAAAAAAAAAAAAAAAzAAAAC3NzaC1lZDI1
            NTE5AAAAIOMqLasseqaQ4n0Vx3jwyYfKAyJa/zIa3sBQjBISyndzAAAAQHRlc3Rr
            ZXkAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            -----END OPENSSH PRIVATE KEY-----
          known_hosts: |
            github.com ssh-rsa 
          if_key_exists: replace
      - name: Assert key file exists after replace
        run: |
          echo "Checking ~/.ssh/id_rsa exists..."
          if [ ! -f "$HOME/.ssh/id_rsa" ]; then
            echo "FAIL: ~/.ssh/id_rsa not found"
            exit 1
          fi
          echo "PASS: key file exists"
      - name: Assert key content was replaced (not the old content)
        run: |
          CONTENT=$(cat "$HOME/.ssh/id_rsa")
          echo "Key content starts with: $(echo "$CONTENT" | head -1)"
          if [ "$CONTENT" = "old-key-content" ]; then
            echo "FAIL: key content was NOT replaced, still has old content"
            exit 1
          fi
          echo "PASS: key content was replaced"
      - name: Assert replaced key file permissions
        run: |
          PERMS=$(stat -c "%a" "$HOME/.ssh/id_rsa")
          echo "Key file permissions: $PERMS"
          if [ "$PERMS" != "400" ]; then
            echo "FAIL: expected permissions 400, got $PERMS"
            exit 1
          fi
          echo "PASS: key file has correct permissions"
