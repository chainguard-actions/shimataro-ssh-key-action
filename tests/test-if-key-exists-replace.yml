name: Test SSH key installation with if_key_exists=replace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test SSH keys
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key1 -N "" -C "first@example.com"
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key2 -N "" -C "second@example.com"
          echo "TEST_SSH_KEY1<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key1 >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "TEST_SSH_KEY2<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key2 >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          FINGERPRINT2=$(ssh-keygen -lf /tmp/test_key2 | awk '{print $2}')
          echo "EXPECTED_FINGERPRINT=$FINGERPRINT2" >> $GITHUB_ENV
          echo "Second key fingerprint: $FINGERPRINT2"

      - name: Install first SSH key
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY1 }}
          known_hosts: "github.com ssh-rsa "
          if_key_exists: fail

      - name: Install second SSH key with if_key_exists=replace
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY2 }}
          known_hosts: "github.com ssh-rsa "
          if_key_exists: replace

      - name: Assert key was replaced with second key
        run: |
          CURRENT_FINGERPRINT=$(ssh-keygen -lf "$HOME/.ssh/id_rsa" | awk '{print $2}')
          echo "Expected fingerprint: $EXPECTED_FINGERPRINT"
          echo "Current fingerprint:  $CURRENT_FINGERPRINT"
          if [ "$CURRENT_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "FAIL: key was not replaced; expected second key fingerprint"
            exit 1
          fi
          echo "PASS: key was replaced with second key"
