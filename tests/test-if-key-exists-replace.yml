name: Test SSH key installation with if_key_exists=replace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate a test SSH key pair
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -C "test@example.com"
          echo "TEST_SSH_KEY<<SSHEOF" >> "$GITHUB_ENV"
          cat /tmp/test_key >> "$GITHUB_ENV"
          echo "SSHEOF" >> "$GITHUB_ENV"

      - name: Pre-install a different SSH key to simulate existing key
        run: |
          mkdir -p /root/.ssh
          chmod 700 /root/.ssh
          ssh-keygen -t rsa -b 2048 -f /root/.ssh/id_rsa -N "" -C "existing@example.com"
          chmod 400 /root/.ssh/id_rsa
          # Record the content of the existing key for comparison
          cp /root/.ssh/id_rsa /tmp/existing_key_content.txt

      - id: action
        name: Install SSH key with if_key_exists=replace
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Assert action succeeded
        run: |
          echo "PASS: action completed without error"

      - name: Assert key was replaced with new key
        run: |
          SSH_DIR="/root/.ssh"
          echo "SSH_DIR=$SSH_DIR"
          ls -la "$SSH_DIR" || true
          # The new key content should differ from the original
          if diff -q "$SSH_DIR/id_rsa" /tmp/existing_key_content.txt > /dev/null 2>&1; then
            echo "FAIL: key was NOT replaced but should have been"
            exit 1
          fi
          echo "PASS: key was replaced with new key"

      - name: Assert new key file has correct permissions
        run: |
          SSH_DIR="/root/.ssh"
          PERMS=$(stat -c "%a" "$SSH_DIR/id_rsa")
          echo "permissions: $PERMS"
          if [ "$PERMS" != "400" ]; then
            echo "FAIL: expected permissions 400, got $PERMS"
            exit 1
          fi
          echo "PASS: permissions are 400"
