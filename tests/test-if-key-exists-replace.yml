name: Test SSH key installation with if_key_exists=replace
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate two test SSH key pairs
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key1 -N "" -C "test1@example.com"
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key2 -N "" -C "test2@example.com"
          echo "TEST_SSH_KEY1<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key1 >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "TEST_SSH_KEY2<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key2 >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Install first SSH key
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY1 }}
          name: id_rsa
          known_hosts: "github.com ssh-rsa "

      - name: Capture fingerprint of first key
        run: |
          # The key is installed with mode 400; ssh-keygen -lf can read it
          FP=$(ssh-keygen -lf "$HOME/.ssh/id_rsa" | awk '{print $2}')
          echo "FIRST_KEY_FP=$FP" >> $GITHUB_ENV
          echo "First key fingerprint: $FP"

      - name: Install second SSH key with if_key_exists=replace
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY2 }}
          name: id_rsa
          known_hosts: "github.com ssh-rsa "
          if_key_exists: replace

      - name: Assert key was replaced with the new one
        run: |
          CURRENT_FP=$(ssh-keygen -lf "$HOME/.ssh/id_rsa" | awk '{print $2}')
          echo "Current key fingerprint: $CURRENT_FP"
          echo "First key fingerprint:   $FIRST_KEY_FP"
          if [ "$CURRENT_FP" = "$FIRST_KEY_FP" ]; then
            echo "FAIL: key was NOT replaced but if_key_exists=replace should have replaced it"
            exit 1
          fi
          echo "PASS: key was replaced with the new key"
