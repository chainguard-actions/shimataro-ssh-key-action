name: Test if_key_exists=replace behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate first test SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_key1 -N "" -C "first@example.com"
          echo "TEST_SSH_KEY1<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key1 >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate second test SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_key2 -N "" -C "second@example.com"
          echo "TEST_SSH_KEY2<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key2 >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Install first SSH key
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY1 }}
          name: id_rsa
          known_hosts: "github.com ssh-rsa "
          if_key_exists: fail

      - name: Capture first key fingerprint
        run: |
          FINGERPRINT=$(ssh-keygen -lf "$HOME/.ssh/id_rsa" | awk '{print $2}')
          echo "FIRST_FINGERPRINT=$FINGERPRINT" >> $GITHUB_ENV
          echo "First key fingerprint: $FINGERPRINT"

      - name: Install second SSH key with if_key_exists=replace
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY2 }}
          name: id_rsa
          known_hosts: "github.com ssh-rsa "
          if_key_exists: replace

      - name: Assert key was replaced with the new key
        run: |
          CURRENT_FINGERPRINT=$(ssh-keygen -lf "$HOME/.ssh/id_rsa" | awk '{print $2}')
          echo "First key fingerprint:   $FIRST_FINGERPRINT"
          echo "Current key fingerprint: $CURRENT_FINGERPRINT"
          if [ "$CURRENT_FINGERPRINT" = "$FIRST_FINGERPRINT" ]; then
            echo "FAIL: key was NOT replaced but if_key_exists=replace should have replaced it"
            exit 1
          fi
          echo "PASS: key was replaced when if_key_exists=replace"

      - name: Assert replaced key has correct permissions
        run: |
          KEY_FILE="$HOME/.ssh/id_rsa"
          PERMS=$(stat -c "%a" "$KEY_FILE")
          echo "Permissions: $PERMS"
          # The action creates the key file with mode 0o400 (read-only for owner)
          if [ "$PERMS" != "400" ]; then
            echo "FAIL: expected permissions 400, got $PERMS"
            exit 1
          fi
          echo "PASS: replaced SSH key file has correct permissions (400)"
