name: Test SSH key installation with if_key_exists=ignore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test SSH key
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          echo "TEST_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Pre-install a key to simulate existing key
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keygen -t rsa -b 2048 -f "$HOME/.ssh/id_rsa" -N "" -q
          chmod 600 "$HOME/.ssh/id_rsa"

      - id: action
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY }}
          known_hosts: "github.com ssh-rsa "
          if_key_exists: ignore

      - name: Assert action completed without error
        run: |
          echo "PASS: action completed with if_key_exists=ignore when key already existed"
