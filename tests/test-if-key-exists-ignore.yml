name: Test SSH key installation with if_key_exists=ignore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test SSH key pair
        id: keygen
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/test_key -N "" -q
          PRIVATE_KEY=$(cat /tmp/test_key)
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          echo "$PRIVATE_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install SSH key first time
        id: first-install
        uses: .
        with:
          key: ${{ steps.keygen.outputs.private_key }}
          known_hosts: "github.com ssh-rsa "
          name: id_rsa
          if_key_exists: fail

      - name: Assert first key installed
        run: |
          if [ ! -f "$HOME/.ssh/id_rsa" ]; then
            echo "FAIL: ~/.ssh/id_rsa not found after first install"
            exit 1
          fi
          echo "PASS: First key installed successfully"

      - name: Install SSH key second time with if_key_exists=ignore
        id: second-install
        uses: .
        with:
          key: ${{ steps.keygen.outputs.private_key }}
          known_hosts: "github.com ssh-rsa "
          name: id_rsa
          if_key_exists: ignore

      - name: Assert key still exists after ignore
        run: |
          if [ ! -f "$HOME/.ssh/id_rsa" ]; then
            echo "FAIL: ~/.ssh/id_rsa not found after second install with ignore"
            exit 1
          fi
          echo "PASS: Key still exists after if_key_exists=ignore"
