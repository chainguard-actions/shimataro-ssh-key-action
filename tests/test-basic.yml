name: Test basic SSH key installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install-key
        uses: .
        with:
          key: |
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAAbG9nZ2luLXBhc3N3b3JkAAAAFgAAAAEAAAAzAAAAC3NzaC1l
            ZDI1NTE5AAAAIOMqLasseqaQ4n0Vx3jwyYfKAyJa/zIa3sBQjBISyndzAAAAsHRlc3Rr
            ZXkAAAAAAAAAAAAAAAAzAAAAC3NzaC1lZDI1NTE5AAAAIOMqLasseqaQ4n0Vx3jwyYfK
            AyJa/zIa3sBQjBISyndzAAAAQHRlc3RrZXkAAAAAAAAAAAAAAAAzAAAAC3NzaC1lZDI1
            NTE5AAAAIOMqLasseqaQ4n0Vx3jwyYfKAyJa/zIa3sBQjBISyndzAAAAQHRlc3Rr
            ZXkAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
            -----END OPENSSH PRIVATE KEY-----
          known_hosts: |
            github.com ssh-rsa 
      - name: Assert key file exists
        run: |
          echo "Checking ~/.ssh/id_rsa exists..."
          if [ ! -f "$HOME/.ssh/id_rsa" ]; then
            echo "FAIL: ~/.ssh/id_rsa not found"
            exit 1
          fi
          echo "PASS: key file exists"
      - name: Assert known_hosts file exists
        run: |
          echo "Checking ~/.ssh/known_hosts exists..."
          if [ ! -f "$HOME/.ssh/known_hosts" ]; then
            echo "FAIL: ~/.ssh/known_hosts not found"
            exit 1
          fi
          echo "PASS: known_hosts file exists"
      - name: Assert key file permissions
        run: |
          PERMS=$(stat -c "%a" "$HOME/.ssh/id_rsa")
          echo "Key file permissions: $PERMS"
          if [ "$PERMS" != "400" ]; then
            echo "FAIL: expected permissions 400, got $PERMS"
            exit 1
          fi
          echo "PASS: key file has correct permissions"
      - name: Assert known_hosts contains github.com
        run: |
          echo "Checking known_hosts contains github.com..."
          if ! grep -q "github.com" "$HOME/.ssh/known_hosts"; then
            echo "FAIL: known_hosts does not contain github.com"
            exit 1
          fi
          echo "PASS: known_hosts contains github.com"
