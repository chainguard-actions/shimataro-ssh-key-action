name: Test basic SSH key installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate test SSH key
        run: |
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -C "test@example.com"
          echo "TEST_SSH_KEY<<EOF" >> $GITHUB_ENV
          cat /tmp/test_key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Install SSH key
        id: action
        uses: .
        with:
          key: ${{ env.TEST_SSH_KEY }}
          known_hosts: "github.com ssh-rsa "
          if_key_exists: fail

      - name: Assert SSH key file exists
        run: |
          KEY_FILE="$HOME/.ssh/id_rsa"
          echo "Checking for SSH key at: $KEY_FILE"
          if [ ! -f "$KEY_FILE" ]; then
            echo "FAIL: SSH key file not found at $KEY_FILE"
            exit 1
          fi
          echo "PASS: SSH key file exists"

      - name: Assert SSH key file permissions
        run: |
          KEY_FILE="$HOME/.ssh/id_rsa"
          PERMS=$(stat -c "%a" "$KEY_FILE")
          echo "Permissions: $PERMS"
          # The action creates the key file with mode 0o400 (read-only for owner)
          if [ "$PERMS" != "400" ]; then
            echo "FAIL: expected permissions 400, got $PERMS"
            exit 1
          fi
          echo "PASS: SSH key file has correct permissions (400)"

      - name: Assert known_hosts file exists and contains entry
        run: |
          KNOWN_HOSTS="$HOME/.ssh/known_hosts"
          echo "Checking for known_hosts at: $KNOWN_HOSTS"
          if [ ! -f "$KNOWN_HOSTS" ]; then
            echo "FAIL: known_hosts file not found"
            exit 1
          fi
          if ! grep -q "github.com" "$KNOWN_HOSTS"; then
            echo "FAIL: github.com not found in known_hosts"
            exit 1
          fi
          echo "PASS: known_hosts file exists and contains github.com entry"
